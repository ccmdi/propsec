name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch core submodule
        run: |
          git config --global url."https://x-access-token:${{ secrets.MDLSP_TOKEN }}@github.com/ccmdi/mdlsp".insteadOf "https://github.com/ccmdi/mdlsp"
          git submodule update --init
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

